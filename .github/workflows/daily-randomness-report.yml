name: Daily Randomness Report

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: go test ./...

      - name: Run dashboard tests
        run: node --test docs/assets/app.test.mjs

      - name: Generate reports
        run: |
          chmod +x ./bin/randomness-reporter
          ./bin/randomness-reporter -config ./config/sources.json -output ./docs/results

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results
          git diff --cached --quiet && exit 0
          git commit -m "chore: update randomness reports"
          git push
